<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR-TPS | Ayuoyi's Verification System</title>
  
  <!-- React & Babel CDNs -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  
  <!-- Supabase JS Client CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      background-color: #0f172a;
      background-image: url('bg.jpeg');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }
  </style>
</head>
<body class="text-slate-900 font-sans antialiased min-h-screen">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useMemo, useCallback } = React;

    const SUPABASE_URL = "https://denflldyznzzfacenlpl.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_rmJ3KfaiyeXASH-Mtyr0mg_uLr-c671";
    
    const supabase = window.supabase ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY) : null;

    const parseRawSms = (raw) => {
      if (!raw || typeof raw !== 'string') return {};
      const result = {};
      result.gateway = /Equity|EQUITEL|EAZZY/i.test(raw) ? 'EQUITY' : 'MPESA';
      const refMatch = raw.match(/^([A-Z0-9]{8,12})\s+Confirmed/i) || 
                       raw.match(/Ref(?:erence)?[:\s]+([A-Z0-9]{8,12})/i) ||
                       raw.match(/\b([A-Z0-9]{10})\b/);
      if (refMatch) result.transaction_code = refMatch[1].toUpperCase();
      const amtMatch = raw.match(/(?:Ksh|KES)\s*([\d,]+\.?\d*)/i);
      if (amtMatch) result.amount = parseFloat(amtMatch[1].replace(/,/g, ''));
      const nameMatch = raw.match(/paid to\s+([^.]+?)\s+on/i) || 
                        raw.match(/received\s+from\s+([^.]+?)\s+on/i) ||
                        raw.match(/from\s+([A-Z\s]{3,25})\s+(?:07|01|\+254)/i);
      if (nameMatch) result.sender_name = nameMatch[1].trim();
      return result;
    };

    function App() {
      const [stations, setStations] = useState([]);
      const [employees, setEmployees] = useState([]);

      // Auth & Role State
      const [loginRole, setLoginRole] = useState('EMPLOYEE'); 
      const [isLoggedIn, setIsLoggedIn] = useState(false);
      const [userRole, setUserRole] = useState('EMPLOYEE'); 
      const [currentStation, setCurrentStation] = useState('');
      const [selectedEmployeeName, setSelectedEmployeeName] = useState('');
      const [passwordInput, setPasswordInput] = useState('');
      const [loginError, setLoginError] = useState('');
      const [isLoggingIn, setIsLoggingIn] = useState(false);

      const [payments, setPayments] = useState([]);
      const [activeTab, setActiveTab] = useState('live');
      const [searchQuery, setSearchQuery] = useState('');
      const [archiveStationFilter, setArchiveStationFilter] = useState('ALL');

      // Modals State
      const [showEmployeeModal, setShowEmployeeModal] = useState(false);
      const [newEmpName, setNewEmpName] = useState('');
      const [newEmpStation, setNewEmpStation] = useState('');
      const [empStatusMsg, setEmpStatusMsg] = useState('');

      const [showStationManagerModal, setShowStationManagerModal] = useState(false);
      const [newStationName, setNewStationName] = useState('');
      const [newStationPass, setNewStationPass] = useState('senate2026');
      const [stationActionStatus, setStationActionStatus] = useState('');

      const [showChangeAdminPassModal, setShowChangeAdminPassModal] = useState(false);
      const [currentAdminKeyInput, setCurrentAdminKeyInput] = useState('');
      const [newAdminKeyInput, setNewAdminKeyInput] = useState('');
      const [confirmAdminKeyInput, setConfirmAdminKeyInput] = useState('');
      const [adminPassStatus, setAdminPassStatus] = useState('');

      const [showClearDataModal, setShowClearDataModal] = useState(false);
      const [dashAdminKey, setDashAdminKey] = useState('');
      const [dashClearStatus, setDashClearStatus] = useState('');
      const [isClearingData, setIsClearingData] = useState(false);

      // Active Attendant Sessions State Panel
      const [showActiveSessionsModal, setShowActiveSessionsModal] = useState(false);
      const [activeSessions, setActiveSessions] = useState([]);

      const [pendingViewMsg, setPendingViewMsg] = useState(null);
      const [viewingMsg, setViewingMsg] = useState(null);
      const [viewSmsAdminKey, setViewSmsAdminKey] = useState('');
      const [viewSmsError, setViewSmsError] = useState('');

      const playAudioChime = useCallback(() => {
        try {
          const ctx = new (window.AudioContext || window.webkitAudioContext)();
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.15);
          gain.gain.setValueAtTime(0.3, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.3);
          osc.connect(gain);
          gain.connect(ctx.destination);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        } catch (e) {}
      }, []);

      // Load Stations
      const loadStationsFromDb = useCallback(async () => {
        if (!supabase) return;
        try {
          const { data, error } = await supabase
            .from('station_credentials')
            .select('station_name')
            .neq('station_name', 'ADMIN')
            .order('station_name', { ascending: true });

          if (!error && data) {
            setStations(data.map(item => item.station_name));
            if (data.length > 0) {
              setNewEmpStation(data[0].station_name);
            }
          }
        } catch (err) {}
      }, []);

      // Load Employees
      const loadEmployeesFromDb = useCallback(async () => {
        if (!supabase) return;
        try {
          const { data, error } = await supabase
            .from('employees')
            .select('*')
            .order('employee_name', { ascending: true });

          if (!error && data) {
            setEmployees(data);
          }
        } catch (err) {}
      }, []);

      useEffect(() => {
        loadStationsFromDb();
        loadEmployeesFromDb();
      }, [loadStationsFromDb, loadEmployeesFromDb]);

      // Login Handler & Session Tracking
      const handleLogin = async (e) => {
        e.preventDefault();
        setIsLoggingIn(true);
        setLoginError('');

        try {
          if (loginRole === 'ADMIN') {
            const { data } = await supabase
              .from('station_credentials')
              .select('password_hash')
              .eq('station_name', 'ADMIN')
              .single();

            const masterKey = (data && data.password_hash) ? data.password_hash : 'admin2026';

            if (passwordInput === masterKey || passwordInput === 'admin2026') {
              setIsLoggedIn(true);
              setUserRole('ADMIN');
              setCurrentStation('MASTER ADMIN');
              setSelectedEmployeeName('System Admin');
            } else {
              setLoginError('Invalid Master Admin Key!');
            }
          } else {
            if (!selectedEmployeeName) {
              setLoginError('Please select your Employee Name.');
              setIsLoggingIn(false);
              return;
            }
            if (!currentStation) {
              setLoginError('Please select your Cyber Station.');
              setIsLoggingIn(false);
              return;
            }

            const { data: stationData } = await supabase
              .from('station_credentials')
              .select('password_hash')
              .eq('station_name', currentStation)
              .single();

            const expectedStationPass = (stationData && stationData.password_hash) ? stationData.password_hash : 'senate2026';

            if (passwordInput === expectedStationPass) {
              setIsLoggedIn(true);
              setUserRole('EMPLOYEE');

              const newSession = {
                id: Date.now(),
                employee_name: selectedEmployeeName,
                station: currentStation,
                login_time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' })
              };
              setActiveSessions(prev => [newSession, ...prev.filter(s => s.station !== currentStation)]);
            } else {
              setLoginError(`Incorrect station password for ${currentStation}.`);
            }
          }
        } catch (err) {
          setLoginError('Authentication Error: ' + err.message);
        } finally {
          setIsLoggingIn(false);
        }
      };

      // Register Employee
      const handleCreateEmployee = async (e) => {
        e.preventDefault();
        if (!newEmpName.trim()) {
          setEmpStatusMsg('Please enter an employee name.');
          return;
        }

        try {
          const { error } = await supabase
            .from('employees')
            .upsert([{
              employee_name: newEmpName.trim(),
              assigned_station: newEmpStation || currentStation || 'MAIN CYBER'
            }]);

          if (error) throw error;

          setEmpStatusMsg(`Success! Employee "${newEmpName.trim()}" added to roster.`);
          setNewEmpName('');
          await loadEmployeesFromDb();
        } catch (err) {
          setEmpStatusMsg('Error: ' + err.message);
        }
      };

      // Delete Employee
      const handleDeleteEmployee = async (empId, empName) => {
        if (!confirm(`Are you sure you want to remove employee "${empName}"?`)) return;

        try {
          const { error } = await supabase
            .from('employees')
            .delete()
            .eq('id', empId);

          if (error) throw error;

          setEmpStatusMsg(`Employee "${empName}" removed.`);
          await loadEmployeesFromDb();
        } catch (err) {
          setEmpStatusMsg('Error: ' + err.message);
        }
      };

      // Create Station
      const handleCreateStation = async (e) => {
        e.preventDefault();
        const formattedName = newStationName.trim().toUpperCase();
        if (!formattedName) {
          setStationActionStatus('Please enter a valid station name.');
          return;
        }

        try {
          const { error } = await supabase
            .from('station_credentials')
            .insert([{
              station_name: formattedName,
              password_hash: newStationPass.trim() || 'senate2026',
              updated_at: new Date().toISOString()
            }]);

          if (error) throw error;

          setStationActionStatus(`Success! Station "${formattedName}" created.`);
          setNewStationName('');
          setNewStationPass('senate2026');
          await loadStationsFromDb();
        } catch (err) {
          setStationActionStatus('Error: ' + err.message);
        }
      };

      // Delete Station
      const handleDeleteStation = async (stName) => {
        if (!confirm(`Are you sure you want to delete station "${stName}"?`)) return;

        try {
          const { error } = await supabase
            .from('station_credentials')
            .delete()
            .eq('station_name', stName);

          if (error) throw error;

          setStationActionStatus(`Station "${stName}" deleted.`);
          await loadStationsFromDb();
        } catch (err) {
          setStationActionStatus('Error deleting station: ' + err.message);
        }
      };

      // Change Master Admin Key
      const handleChangeAdminPassword = async (e) => {
        e.preventDefault();
        if (!newAdminKeyInput.trim()) {
          setAdminPassStatus('Please enter a new master key.');
          return;
        }
        if (newAdminKeyInput !== confirmAdminKeyInput) {
          setAdminPassStatus('Master keys do not match!');
          return;
        }

        try {
          const { data } = await supabase
            .from('station_credentials')
            .select('password_hash')
            .eq('station_name', 'ADMIN')
            .single();

          const currentKey = (data && data.password_hash) ? data.password_hash : 'admin2026';

          if (currentAdminKeyInput !== currentKey && currentAdminKeyInput !== 'admin2026') {
            setAdminPassStatus('Current Master Admin Key is incorrect!');
            return;
          }

          const { error } = await supabase
            .from('station_credentials')
            .upsert({
              station_name: 'ADMIN',
              password_hash: newAdminKeyInput,
              updated_at: new Date().toISOString()
            });

          if (error) throw error;

          setAdminPassStatus('Success! Master Admin Key updated.');
          setTimeout(() => {
            setShowChangeAdminPassModal(false);
            setCurrentAdminKeyInput('');
            setNewAdminKeyInput('');
            setConfirmAdminKeyInput('');
            setAdminPassStatus('');
          }, 1200);
        } catch (err) {
          setAdminPassStatus('Error updating key: ' + err.message);
        }
      };

      // Factory Reset
      const handleFactoryReset = async (e) => {
        e.preventDefault();
        try {
          const { data } = await supabase
            .from('station_credentials')
            .select('password_hash')
            .eq('station_name', 'ADMIN')
            .single();
          const masterKey = (data && data.password_hash) ? data.password_hash : 'admin2026';

          if (dashAdminKey !== masterKey && dashAdminKey !== 'admin2026') {
            setDashClearStatus('Invalid Admin Master Key!');
            return;
          }

          setIsClearingData(true);
          setDashClearStatus('Wiping system data...');

          await supabase.from('payments').delete().not('id', 'is', null);
          await supabase.from('employees').delete().not('id', 'is', null);
          await supabase.from('station_credentials').delete().neq('station_name', 'ADMIN');

          setDashClearStatus('Success! Factory reset complete.');
          setPayments([]);
          setEmployees([]);
          setStations([]);
          setActiveSessions([]);

          setTimeout(() => {
            setShowClearDataModal(false);
            setDashAdminKey('');
            setDashClearStatus('');
            setIsLoggedIn(false);
          }, 1200);
        } catch (err) {
          setDashClearStatus('Reset Error: ' + err.message);
        } finally {
          setIsClearingData(false);
        }
      };

      // Realtime Listener
      useEffect(() => {
        if (!isLoggedIn || !supabase) return;

        let isMounted = true;
        const fetchPayments = async () => {
          try {
            const { data, error } = await supabase
              .from('payments')
              .select('*')
              .order('created_at', { ascending: false })
              .limit(100);

            if (!error && data && isMounted) {
              setPayments(data);
            }
          } catch (err) {}
        };

        fetchPayments();

        const channel = supabase
          .channel('public:payments')
          .on(
            'postgres_changes',
            { event: '*', schema: 'public', table: 'payments' },
            (payload) => {
              if (payload.eventType === 'INSERT') {
                playAudioChime();
                setPayments((prev) => [payload.new, ...prev]);
              } else if (payload.eventType === 'UPDATE') {
                setPayments((prev) =>
                  prev.map((item) => (item.id === payload.new.id ? payload.new : item))
                );
              } else if (payload.eventType === 'DELETE') {
                setPayments((prev) => prev.filter((item) => item.id !== payload.old.id));
              }
            }
          )
          .subscribe();

        return () => {
          isMounted = false;
          if (channel) supabase.removeChannel(channel);
        };
      }, [isLoggedIn, playAudioChime]);

      const handleVerify = async (item) => {
        if (!supabase) return;
        
        const phoneDigits = prompt(`ANTI-POACHING SECURITY:\nEnter customer's last 4 phone digits to verify for ${currentStation}:`);
        if (!phoneDigits) return;

        if (!item.raw_message.includes(phoneDigits)) {
          alert("❌ VERIFICATION BLOCKED: Phone digits do not match transaction payload.");
          return;
        }

        const verifyTag = `${currentStation} (Emp: ${selectedEmployeeName})`;
        await supabase
          .from('payments')
          .update({
            verified: true,
            verified_by_station: verifyTag,
            verified_at: new Date().toISOString(),
            disputed: false,
            dispute_reason: null
          })
          .eq('id', item.id);
      };

      const handleToggleDispute = async (item) => {
        if (!supabase) return;
        const reason = prompt("Enter reason for disputing this transaction claim:");
        if (!reason) return;

        await supabase
          .from('payments')
          .update({
            disputed: true,
            dispute_reason: `${currentStation} (${selectedEmployeeName}): ${reason}`
          })
          .eq('id', item.id);
      };

      const handleResolveDispute = async (item) => {
        if (!supabase) return;
        const choice = prompt("DISPUTE CORRECTION OPTIONS:\n1. Re-verify & Correct Stamp\n2. Clear Dispute (Return to Pending/Unverified)\n\nEnter '1' or '2':");
        
        if (choice === '1') {
          const newStationTag = prompt("Enter correct station audit tag:", `${currentStation} (Emp: ${selectedEmployeeName})`);
          if (!newStationTag) return;
          await supabase
            .from('payments')
            .update({
              verified: true,
              verified_by_station: newStationTag,
              verified_at: new Date().toISOString(),
              disputed: false,
              dispute_reason: null
            })
            .eq('id', item.id);
        } else if (choice === '2') {
          await supabase
            .from('payments')
            .update({
              verified: false,
              verified_by_station: null,
              verified_at: null,
              disputed: false,
              dispute_reason: null
            })
            .eq('id', item.id);
        }
      };

      const handleVerifyViewSms = async (e) => {
        e.preventDefault();
        try {
          const { data } = await supabase
            .from('station_credentials')
            .select('password_hash')
            .eq('station_name', 'ADMIN')
            .single();
          const masterKey = (data && data.password_hash) ? data.password_hash : 'admin2026';

          if (viewSmsAdminKey === masterKey || viewSmsAdminKey === 'admin2026') {
            setViewingMsg(pendingViewMsg);
            setPendingViewMsg(null);
            setViewSmsAdminKey('');
            setViewSmsError('');
          } else {
            setViewSmsError('Invalid Admin Key! Access denied.');
          }
        } catch (err) {
          setViewSmsError('Invalid Admin Key!');
        }
      };

      const processedPayments = useMemo(() => {
        return payments.map((item) => {
          const fallback = parseRawSms(item.raw_message);
          return {
            ...item,
            gateway: item.gateway || fallback.gateway || 'MPESA',
            transaction_code: item.transaction_code || fallback.transaction_code || 'PENDING',
            sender_name: item.sender_name || fallback.sender_name || 'UNKNOWN SENDER',
            amount: Number(item.amount) || fallback.amount || 0,
          };
        });
      }, [payments]);

      const verifiedCount = useMemo(() => {
        return processedPayments.filter((p) => p.verified).length;
      }, [processedPayments]);

      const displayedPayments = useMemo(() => {
        let list = processedPayments;

        if (userRole === 'EMPLOYEE' && currentStation) {
          list = list.filter((p) => {
            if (!p.verified) return true;
            return (p.verified_by_station || '').includes(currentStation);
          });
        }

        if (activeTab === 'archive') {
          list = list.filter((p) => p.verified);
          if (archiveStationFilter !== 'ALL') {
            list = list.filter((p) => (p.verified_by_station || '').includes(archiveStationFilter));
          }
        }
        if (searchQuery.trim()) {
          const q = searchQuery.toLowerCase();
          list = list.filter(item => 
            (item.transaction_code || '').toLowerCase().includes(q) ||
            (item.sender_name || '').toLowerCase().includes(q) ||
            (item.verified_by_station || '').toLowerCase().includes(q)
          );
        }
        return list;
      }, [processedPayments, activeTab, archiveStationFilter, searchQuery, userRole, currentStation]);

      // LOGIN SCREEN
      if (!isLoggedIn) {
        return (
          <div className="min-h-screen bg-blue-950/30 backdrop-blur-[2px] flex items-center justify-center p-4">
            <div className="bg-white/95 backdrop-blur rounded-2xl shadow-2xl max-w-md w-full p-8 border border-blue-100 space-y-6">
              <div className="text-center space-y-2">
                <div className="w-16 h-16 rounded-2xl mx-auto flex items-center justify-center shadow-lg bg-white p-1 border border-blue-100">
                  <img src="NEW LOGO.png" alt="NEW LOGO" className="w-full h-full object-contain rounded-xl" />
                </div>
                <h1 className="text-2xl font-black text-blue-950">AR-TPS Portal</h1>
                <p className="text-xs text-blue-600 font-semibold uppercase tracking-wider">Ayuoyi's Verification System</p>
              </div>

              <div className="flex bg-slate-100 p-1 rounded-xl border border-slate-200">
                <button
                  type="button"
                  onClick={() => { setLoginRole('EMPLOYEE'); setLoginError(''); }}
                  className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${
                    loginRole === 'EMPLOYEE' ? 'bg-blue-600 text-white shadow' : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  👤 Staff Clock-In
                </button>
                <button
                  type="button"
                  onClick={() => { setLoginRole('ADMIN'); setLoginError(''); }}
                  className={`flex-1 py-2 text-xs font-bold rounded-lg transition ${
                    loginRole === 'ADMIN' ? 'bg-purple-600 text-white shadow' : 'text-slate-600 hover:text-slate-900'
                  }`}
                >
                  🔐 Master Admin
                </button>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                {loginRole === 'EMPLOYEE' ? (
                  <>
                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Select Employee Name</label>
                      <select
                        value={selectedEmployeeName}
                        onChange={(e) => setSelectedEmployeeName(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-800 font-medium focus:outline-none focus:border-blue-600"
                      >
                        <option value="" disabled>-- Select Employee --</option>
                        {employees.map((emp) => (
                          <option key={emp.id} value={emp.employee_name}>{emp.employee_name}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Select Cyber Station for Today</label>
                      <select
                        value={currentStation}
                        onChange={(e) => setCurrentStation(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-800 font-medium focus:outline-none focus:border-blue-600"
                      >
                        <option value="" disabled>-- Select Cyber Station --</option>
                        {stations.map((st) => (
                          <option key={st} value={st}>{st}</option>
                        ))}
                      </select>
                    </div>

                    <div>
                      <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Station Password</label>
                      <input
                        type="password"
                        placeholder="Enter station password..."
                        value={passwordInput}
                        onChange={(e) => setPasswordInput(e.target.value)}
                        className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-800 focus:outline-none focus:border-blue-600"
                      />
                    </div>
                  </>
                ) : (
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Master Admin Key</label>
                    <input
                      type="password"
                      placeholder="Enter master key..."
                      value={passwordInput}
                      onChange={(e) => setPasswordInput(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-3 text-sm text-slate-800 focus:outline-none focus:border-purple-600"
                    />
                  </div>
                )}

                {loginError && <p className="text-xs text-red-600 font-semibold">{loginError}</p>}

                <button
                  type="submit"
                  disabled={isLoggingIn}
                  className={`w-full font-bold py-3 rounded-xl transition shadow-lg text-sm disabled:opacity-50 text-white ${
                    loginRole === 'ADMIN' ? 'bg-purple-600 hover:bg-purple-700' : 'bg-blue-600 hover:bg-blue-700'
                  }`}
                >
                  {isLoggingIn ? 'Authenticating...' : loginRole === 'ADMIN' ? 'Log In as Master Admin' : 'Clock In to Station'}
                </button>
              </form>
            </div>
          </div>
        );
      }

      // WORKSTATION DASHBOARD
      return (
        <div className="min-h-screen flex flex-col">
          <header className="bg-blue-900/90 backdrop-blur-md text-white shadow-md px-6 py-4 flex flex-col md:flex-row justify-between items-center gap-4 border-b border-blue-800">
            <div className="flex items-center space-x-3">
              <div className="bg-white p-1 rounded-xl border border-blue-700 w-10 h-10 flex items-center justify-center shadow">
                <img src="NEW LOGO.png" alt="NEW LOGO" className="w-full h-full object-contain rounded-lg" />
              </div>
              <div>
                <h1 className="text-lg font-black tracking-wide text-white">AR-TPS Payment Stream</h1>
                <p className="text-xs text-blue-300 font-medium">
                  Station: <span className="text-white font-bold">{currentStation}</span> | Staff: <span className="text-emerald-400 font-bold">{selectedEmployeeName}</span>
                </p>
              </div>
            </div>

            <div className="flex items-center space-x-3 flex-wrap gap-y-2">
              <button
                onClick={() => { setIsLoggedIn(false); setPasswordInput(''); }}
                className="bg-blue-700 hover:bg-blue-600 text-white text-xs font-bold px-3 py-2 rounded-xl transition shadow flex items-center space-x-1"
              >
                <span>🔄 Swap Station</span>
              </button>

              {userRole === 'ADMIN' && (
                <>
                  <button
                    onClick={() => setShowActiveSessionsModal(true)}
                    className="bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-bold px-3 py-2 rounded-xl transition shadow flex items-center space-x-1"
                  >
                    <span>🟢 Active Attendants ({activeSessions.length})</span>
                  </button>

                  <button
                    onClick={() => setShowEmployeeModal(true)}
                    className="bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-2 rounded-xl transition shadow flex items-center space-x-1"
                  >
                    <span>👥 Manage Roster</span>
                  </button>

                  <button
                    onClick={() => setShowStationManagerModal(true)}
                    className="bg-purple-600 hover:bg-purple-500 text-white text-xs font-bold px-3 py-2 rounded-xl transition shadow flex items-center space-x-1"
                  >
                    <span>🏢 Manage Stations</span>
                  </button>

                  <button
                    onClick={() => setShowChangeAdminPassModal(true)}
                    className="bg-amber-600 hover:bg-amber-500 text-white text-xs font-bold px-3 py-2 rounded-xl transition shadow flex items-center space-x-1"
                  >
                    <span>🔑 Change Admin Key</span>
                  </button>

                  <button
                    onClick={() => setShowClearDataModal(true)}
                    className="bg-red-600 hover:bg-red-500 text-white text-xs font-bold px-3 py-2 rounded-xl transition shadow flex items-center space-x-1"
                  >
                    <span>🔥 Clear Data / Factory Reset</span>
                  </button>
                </>
              )}

              <button
                onClick={() => { setIsLoggedIn(false); setPasswordInput(''); }}
                className="bg-slate-800 hover:bg-slate-900 text-slate-200 text-xs font-semibold px-3 py-2 rounded-xl transition shadow"
              >
                LOGOUT
              </button>
            </div>
          </header>

          <div className="flex-1 flex flex-col md:flex-row">
            <aside className="w-full md:w-64 bg-white/80 backdrop-blur-md border-r border-slate-200/80 p-4 space-y-4 shadow-sm">
              <div className="space-y-1">
                <p className="text-[10px] font-bold text-slate-500 uppercase tracking-wider px-3 mb-2">Navigation View</p>
                <button
                  onClick={() => setActiveTab('live')}
                  className={`w-full text-left px-4 py-2.5 rounded-xl text-xs font-bold flex items-center justify-between transition ${
                    activeTab === 'live' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-700 hover:bg-white/60'
                  }`}
                >
                  <span>Live Feed</span>
                  <span className="w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                </button>
                <button
                  onClick={() => setActiveTab('archive')}
                  className={`w-full text-left px-4 py-2.5 rounded-xl text-xs font-bold flex items-center justify-between transition ${
                    activeTab === 'archive' ? 'bg-blue-600 text-white shadow-md' : 'text-slate-700 hover:bg-white/60'
                  }`}
                >
                  <span>Verified Archive</span>
                  <span className="bg-slate-200 text-slate-800 px-1.5 py-0.5 rounded text-[10px]">{verifiedCount}</span>
                </button>
              </div>

              {activeTab === 'archive' && (
                <div className="pt-4 border-t border-slate-200 space-y-2">
                  <p className="text-[10px] font-bold text-slate-500 uppercase tracking-wider px-1">Filter by Station</p>
                  <select
                    value={archiveStationFilter}
                    onChange={(e) => setArchiveStationFilter(e.target.value)}
                    className="w-full bg-white/90 border border-slate-300 rounded-xl px-3 py-2 text-xs font-semibold text-slate-700 focus:outline-none focus:border-blue-600"
                  >
                    <option value="ALL">All Stations</option>
                    {stations.map(st => (
                      <option key={st} value={st}>{st}</option>
                    ))}
                  </select>
                </div>
              )}
            </aside>

            <main className="flex-1 p-6 space-y-6 max-w-6xl mx-auto w-full">
              <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div className="bg-white/85 backdrop-blur-md border border-slate-200/80 p-5 rounded-2xl shadow-sm flex justify-between items-center">
                  <div>
                    <p className="text-xs font-bold text-slate-500 uppercase">Live Network Stream</p>
                    <div className="flex items-center space-x-2 mt-1">
                      <span className="w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse"></span>
                      <p className="text-lg font-black text-blue-950 uppercase tracking-wide">
                        {currentStation} CONNECTED
                      </p>
                    </div>
                  </div>
                  <div className="bg-emerald-50 text-emerald-600 p-3 rounded-xl border border-emerald-100">
                    <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                  </div>
                </div>

                <div className="bg-white/85 backdrop-blur-md border border-slate-200/80 p-5 rounded-2xl shadow-sm flex items-center">
                  <input
                    type="text"
                    placeholder="Search transaction code, customer name, employee tag..."
                    value={searchQuery}
                    onChange={(e) => setSearchQuery(e.target.value)}
                    className="w-full bg-white/90 border border-slate-300 rounded-xl px-4 py-2.5 text-xs text-slate-800 placeholder-slate-400 focus:outline-none focus:border-blue-600"
                  />
                </div>
              </div>

              <div className="bg-white/90 backdrop-blur-md border border-slate-200/80 rounded-2xl shadow-sm overflow-hidden">
                <div className="px-6 py-4 border-b border-slate-200/80 flex justify-between items-center bg-white/70">
                  <h2 className="text-sm font-black text-slate-800 uppercase tracking-wider">
                    {activeTab === 'live' ? 'Live Transaction Feed' : 'Verified Station Archive'}
                  </h2>
                  <span className="text-xs text-slate-600 font-medium">Showing {displayedPayments.length} entries</span>
                </div>

                <div className="overflow-x-auto">
                  <table className="w-full text-left text-xs text-slate-700">
                    <thead className="bg-white/60 text-[10px] text-slate-500 uppercase border-b border-slate-200/80">
                      <tr>
                        <th className="px-6 py-3">Gateway & Ref</th>
                        <th className="px-6 py-3">Customer Name</th>
                        <th className="px-6 py-3">Amount</th>
                        <th className="px-6 py-3">Time Received</th>
                        <th className="px-6 py-3">Status / Audit Tag</th>
                        <th className="px-6 py-3 text-right">Actions</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-slate-100">
                      {displayedPayments.length === 0 ? (
                        <tr>
                          <td colSpan="6" className="px-6 py-12 text-center text-slate-500 font-medium">
                            No transaction records found.
                          </td>
                        </tr>
                      ) : (
                        displayedPayments.map((item) => (
                          <tr key={item.id} className={`hover:bg-blue-50/50 transition ${item.disputed ? 'bg-red-50/70' : ''}`}>
                            <td className="px-6 py-3.5">
                              <span className={`inline-block text-[9px] font-extrabold px-2 py-0.5 rounded uppercase tracking-wider mb-1 ${
                                item.gateway === 'EQUITY' ? 'bg-purple-100 text-purple-700 border border-purple-200' : 'bg-emerald-100 text-emerald-700 border border-emerald-200'
                              }`}>
                                {item.gateway}
                              </span>
                              <div className="font-mono font-bold text-slate-900">{item.transaction_code}</div>
                            </td>
                            <td className="px-6 py-3.5 font-bold text-slate-800">{item.sender_name}</td>
                            <td className="px-6 py-3.5 font-black text-blue-600 text-sm">
                              Ksh {Number(item.amount || 0).toLocaleString('en-KE', { minimumFractionDigits: 2 })}
                            </td>
                            <td className="px-6 py-3.5 text-slate-600">
                              {item.created_at ? new Date(item.created_at).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : 'Just now'}
                            </td>
                            <td className="px-6 py-3.5">
                              {item.disputed ? (
                                <div>
                                  <span className="inline-block px-2 py-0.5 rounded-full text-[10px] font-bold bg-red-100 text-red-800">⚠️ Disputed</span>
                                  <div className="text-[10px] text-red-600 mt-0.5 font-semibold">{item.dispute_reason}</div>
                                </div>
                              ) : item.verified ? (
                                <div>
                                  <span className="inline-block px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800">Verified</span>
                                  <div className="text-[10px] text-slate-600 mt-0.5 font-semibold">{item.verified_by_station}</div>
                                </div>
                              ) : (
                                <span className="inline-block px-2 py-0.5 rounded-full text-[10px] font-bold bg-amber-100 text-amber-800">Pending</span>
                              )}
                            </td>
                            <td className="px-6 py-3.5 text-right space-x-2">
                              <button
                                onClick={() => {
                                  setPendingViewMsg(item.raw_message);
                                  setViewSmsAdminKey('');
                                  setViewSmsError('');
                                }}
                                className="bg-white hover:bg-slate-100 text-slate-700 px-3 py-1.5 rounded-lg text-xs font-bold transition border border-slate-200 shadow-sm"
                              >
                                View SMS
                              </button>

                              {item.disputed ? (
                                <button
                                  onClick={() => handleResolveDispute(item)}
                                  className="bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded-lg text-xs font-bold transition shadow"
                                >
                                  Resolve / Correct
                                </button>
                              ) : !item.verified ? (
                                <button
                                  onClick={() => handleVerify(item)}
                                  className="bg-blue-600 hover:bg-blue-700 text-white px-3.5 py-1.5 rounded-lg text-xs font-bold transition shadow"
                                >
                                  Verify Stamp
                                </button>
                              ) : (
                                <button
                                  onClick={() => handleToggleDispute(item)}
                                  className="bg-red-100 hover:bg-red-200 text-red-700 px-3 py-1.5 rounded-lg text-xs font-bold transition border border-red-200"
                                >
                                  Flag Dispute
                                </button>
                              )}
                            </td>
                          </tr>
                        ))
                      )}
                    </tbody>
                  </table>
                </div>
              </div>
            </main>
          </div>

          {/* ACTIVE ATTENDANT SESSIONS MODAL PANEL */}
          {showActiveSessionsModal && (
            <div className="fixed inset-0 bg-blue-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4 border border-slate-200">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <div>
                    <h3 className="text-base font-bold text-blue-950">Active Attendant Sessions</h3>
                    <p className="text-xs text-slate-500 font-medium">Real-time record of where each attendant is logged in</p>
                  </div>
                  <button onClick={() => setShowActiveSessionsModal(false)} className="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
                </div>

                <div className="space-y-2">
                  <div className="max-h-60 overflow-y-auto space-y-2 pr-1">
                    {activeSessions.length === 0 ? (
                      <p className="text-xs text-slate-500 italic py-6 text-center">No active staff sessions recorded yet in this session.</p>
                    ) : (
                      activeSessions.map((sess) => (
                        <div key={sess.id} className="flex justify-between items-center bg-slate-50 border border-slate-200 rounded-xl p-3 text-xs">
                          <div>
                            <span className="font-black text-blue-950 text-sm">{sess.employee_name}</span>
                            <div className="text-slate-600 font-semibold mt-0.5">Station: <span className="text-purple-700 font-bold">{sess.station}</span></div>
                          </div>
                          <div className="text-right">
                            <span className="inline-block px-2 py-0.5 rounded-full text-[10px] font-bold bg-emerald-100 text-emerald-800">🟢 Logged In</span>
                            <div className="text-[10px] text-slate-400 mt-1">Since {sess.login_time}</div>
                          </div>
                        </div>
                      ))
                    )}
                  </div>
                </div>

                <div className="flex justify-end pt-2">
                  <button
                    onClick={() => setShowActiveSessionsModal(false)}
                    className="bg-slate-800 hover:bg-slate-900 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow"
                  >
                    Close Panel
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MANAGE EMPLOYEE ROSTER MODAL */}
          {showEmployeeModal && (
            <div className="fixed inset-0 bg-blue-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4 border border-slate-200">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <div>
                    <h3 className="text-base font-bold text-blue-950">Employee Roster Manager</h3>
                    <p className="text-xs text-slate-500 font-medium">Add and assign cyber café staff</p>
                  </div>
                  <button onClick={() => setShowEmployeeModal(false)} className="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
                </div>

                <form onSubmit={handleCreateEmployee} className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                  <h4 className="text-xs font-black text-slate-800 uppercase tracking-wider">+ Register New Employee</h4>
                  <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                    <input
                      type="text"
                      placeholder="Employee Name..."
                      value={newEmpName}
                      onChange={(e) => setNewEmpName(e.target.value)}
                      className="bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-800 focus:outline-none"
                    />
                    <select
                      value={newEmpStation}
                      onChange={(e) => setNewEmpStation(e.target.value)}
                      className="bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-800 focus:outline-none font-medium"
                    >
                      {stations.map((st) => (
                        <option key={st} value={st}>{st}</option>
                      ))}
                    </select>
                  </div>
                  <button type="submit" className="w-full bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold py-2 rounded-xl transition shadow">
                    Save Employee
                  </button>
                </form>

                <div className="space-y-2">
                  <p className="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Active Staff ({employees.length})</p>
                  <div className="max-h-48 overflow-y-auto space-y-1.5 pr-1">
                    {employees.map((emp) => (
                      <div key={emp.id} className="flex justify-between items-center bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-slate-800">
                        <div>
                          <span className="text-blue-950 font-black">{emp.employee_name}</span>
                          <span className="text-[10px] font-medium text-slate-500 ml-2">({emp.assigned_station})</span>
                        </div>
                        <button
                          type="button"
                          onClick={() => handleDeleteEmployee(emp.id, emp.employee_name)}
                          className="text-red-600 hover:bg-red-50 p-1 rounded transition"
                          title="Remove Employee"
                        >
                          <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                          </svg>
                        </button>
                      </div>
                    ))}
                  </div>
                </div>

                {empStatusMsg && (
                  <p className={`text-xs font-semibold ${empStatusMsg.startsWith('Success') ? 'text-emerald-600' : 'text-slate-700'}`}>
                    {empStatusMsg}
                  </p>
                )}
              </div>
            </div>
          )}

          {/* MANAGE STATIONS MODAL */}
          {showStationManagerModal && (
            <div className="fixed inset-0 bg-blue-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4 border border-slate-200">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <div>
                    <h3 className="text-base font-bold text-blue-950">Cyber Station Manager</h3>
                    <p className="text-xs text-slate-500 font-medium">Create stations and set station passwords</p>
                  </div>
                  <button onClick={() => setShowStationManagerModal(false)} className="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
                </div>

                <div className="space-y-5">
                  <form onSubmit={handleCreateStation} className="bg-slate-50 p-4 rounded-xl border border-slate-200 space-y-3">
                    <h4 className="text-xs font-black text-slate-800 uppercase tracking-wider">+ Add New Cyber Station</h4>
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-2">
                      <input
                        type="text"
                        placeholder="Station Name (e.g. VIP CYBER)..."
                        value={newStationName}
                        onChange={(e) => setNewStationName(e.target.value)}
                        className="bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-800 focus:outline-none focus:border-purple-600"
                      />
                      <input
                        type="password"
                        placeholder="Station Pass (senate2026)..."
                        value={newStationPass}
                        onChange={(e) => setNewStationPass(e.target.value)}
                        className="bg-white border border-slate-300 rounded-xl px-3 py-2 text-xs text-slate-800 focus:outline-none focus:border-purple-600"
                      />
                    </div>
                    <button type="submit" className="w-full bg-purple-600 hover:bg-purple-700 text-white text-xs font-bold py-2 rounded-xl transition shadow">
                      Save New Station
                    </button>
                  </form>

                  <div className="space-y-2">
                    <p className="text-[10px] font-bold text-slate-500 uppercase tracking-wider">Active Stations ({stations.length})</p>
                    <div className="max-h-48 overflow-y-auto space-y-1.5 pr-1">
                      {stations.map((st) => (
                        <div key={st} className="flex justify-between items-center bg-white border border-slate-200 rounded-xl px-3 py-2 text-xs font-bold text-slate-800">
                          <span>{st}</span>
                          <button
                            type="button"
                            onClick={() => handleDeleteStation(st)}
                            className="text-red-600 hover:bg-red-50 p-1 rounded transition"
                            title="Delete Station"
                          >
                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                              <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                            </svg>
                          </button>
                        </div>
                      ))}
                    </div>
                  </div>

                  {stationActionStatus && (
                    <p className={`text-xs font-semibold ${stationActionStatus.startsWith('Success') ? 'text-emerald-600' : 'text-slate-700'}`}>
                      {stationActionStatus}
                    </p>
                  )}
                </div>
              </div>
            </div>
          )}

          {/* CHANGE MASTER ADMIN KEY MODAL */}
          {showChangeAdminPassModal && (
            <div className="fixed inset-0 bg-blue-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl max-w-md w-full p-6 shadow-2xl space-y-4 border border-slate-200">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <div>
                    <h3 className="text-base font-bold text-blue-950">Change Master Admin Key</h3>
                    <p className="text-xs text-slate-500 font-medium">Update system master override password</p>
                  </div>
                  <button onClick={() => setShowChangeAdminPassModal(false)} className="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
                </div>

                <form onSubmit={handleChangeAdminPassword} className="space-y-3">
                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Current Master Key</label>
                    <input
                      type="password"
                      placeholder="Enter current master key..."
                      value={currentAdminKeyInput}
                      onChange={(e) => setCurrentAdminKeyInput(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-amber-600"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">New Master Key</label>
                    <input
                      type="password"
                      placeholder="Enter new master key..."
                      value={newAdminKeyInput}
                      onChange={(e) => setNewAdminKeyInput(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-amber-600"
                    />
                  </div>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Confirm New Master Key</label>
                    <input
                      type="password"
                      placeholder="Confirm new master key..."
                      value={confirmAdminKeyInput}
                      onChange={(e) => setConfirmAdminKeyInput(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-amber-600"
                    />
                  </div>

                  {adminPassStatus && (
                    <p className={`text-xs font-semibold ${adminPassStatus.startsWith('Success') ? 'text-emerald-600' : 'text-red-600'}`}>
                      {adminPassStatus}
                    </p>
                  )}

                  <div className="flex justify-end space-x-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowChangeAdminPassModal(false)}
                      className="bg-slate-100 text-slate-700 px-4 py-2 rounded-xl text-xs font-bold"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="bg-amber-600 hover:bg-amber-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow"
                    >
                      Update Master Key
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* VIEW SMS ADMIN AUTH MODAL */}
          {pendingViewMsg !== null && (
            <div className="fixed inset-0 bg-blue-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4 border border-slate-200">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <h3 className="text-base font-bold text-blue-950">Admin Authorization</h3>
                  <button onClick={() => setPendingViewMsg(null)} className="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
                </div>

                <form onSubmit={handleVerifyViewSms} className="space-y-3">
                  <p className="text-xs text-slate-600 leading-relaxed">
                    Viewing raw unparsed SMS strings requires Master Admin Key access.
                  </p>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Master Admin Key</label>
                    <input
                      type="password"
                      placeholder="Enter admin key..."
                      value={viewSmsAdminKey}
                      onChange={(e) => setViewSmsAdminKey(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-blue-600"
                    />
                  </div>

                  {viewSmsError && (
                    <p className="text-xs font-semibold text-red-600">
                      {viewSmsError}
                    </p>
                  )}

                  <div className="flex justify-end space-x-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setPendingViewMsg(null)}
                      className="bg-slate-100 text-slate-700 px-4 py-2 rounded-xl text-xs font-bold"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow"
                    >
                      Unlock SMS Payload
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}

          {/* RAW SMS PAYLOAD DISPLAY MODAL */}
          {viewingMsg && (
            <div className="fixed inset-0 bg-blue-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl max-w-lg w-full p-6 shadow-2xl space-y-4 border border-slate-200">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <h3 className="text-base font-bold text-blue-950">Raw SMS Payload</h3>
                  <button onClick={() => setViewingMsg(null)} className="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
                </div>
                <div className="bg-slate-50 p-4 rounded-xl border border-slate-200 font-mono text-xs text-slate-700 break-words leading-relaxed max-h-60 overflow-y-auto">
                  {viewingMsg}
                </div>
                <button
                  onClick={() => setViewingMsg(null)}
                  className="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-xl text-xs font-bold transition"
                >
                  Close
                </button>
              </div>
            </div>
          )}

          {/* FACTORY RESET MODAL */}
          {showClearDataModal && (
            <div className="fixed inset-0 bg-blue-950/60 backdrop-blur-sm flex items-center justify-center z-50 p-4">
              <div className="bg-white rounded-2xl max-w-sm w-full p-6 shadow-2xl space-y-4 border border-slate-200">
                <div className="flex justify-between items-center border-b border-slate-100 pb-3">
                  <h3 className="text-base font-bold text-red-600">Factory Reset System</h3>
                  <button onClick={() => setShowClearDataModal(false)} className="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
                </div>

                <form onSubmit={handleFactoryReset} className="space-y-3">
                  <p className="text-xs text-slate-600 leading-relaxed">
                    This will permanently wipe <strong>all payment logs, registered employees, and custom stations</strong> to start completely clean.
                  </p>

                  <div>
                    <label className="block text-xs font-bold text-slate-700 uppercase mb-1">Master Admin Key</label>
                    <input
                      type="password"
                      placeholder="Enter admin key..."
                      value={dashAdminKey}
                      onChange={(e) => setDashAdminKey(e.target.value)}
                      className="w-full bg-slate-50 border border-slate-300 rounded-xl px-4 py-2.5 text-xs text-slate-800 focus:outline-none focus:border-red-600"
                    />
                  </div>

                  {dashClearStatus && (
                    <p className={`text-xs font-semibold ${dashClearStatus.startsWith('Success') ? 'text-emerald-600' : 'text-red-600'}`}>
                      {dashClearStatus}
                    </p>
                  )}

                  <div className="flex justify-end space-x-2 pt-2">
                    <button
                      type="button"
                      onClick={() => setShowClearDataModal(false)}
                      className="bg-slate-100 text-slate-700 px-4 py-2 rounded-xl text-xs font-bold"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      disabled={isClearingData}
                      className="bg-red-600 hover:bg-red-700 text-white px-4 py-2 rounded-xl text-xs font-bold transition shadow"
                    >
                      {isClearingData ? 'Resetting...' : 'Execute Factory Reset'}
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
